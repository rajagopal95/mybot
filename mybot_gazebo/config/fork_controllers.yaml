controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 100

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    fork_position_controller:
      type: position_controllers/JointGroupPositionController


diff_drive_controller:
  ros__parameters:
    use_sim_time: true

    # Joint names come from the Fusion export (Rigid_17 = left wheel on
    # left_motor_link_1, Rigid_18 = right wheel on right_motor_link_1).
    # Both wheel axes are +X and forward is -Y in the exported base_link; the
    # base_footprint joint in fork_robot.urdf.xacro rotates that to x-forward,
    # so no swapped names or negative multipliers are needed.
    left_wheel_names: ["Rigid_17"]
    right_wheel_names: ["Rigid_18"]

    # Starting values: wheel-center spacing (0.679 m, the collision cylinders sit at the link origins) and
    # the 0.053 m collision-cylinder radius in fork_robot.urdf.xacro (keep them equal).
    # Calibrate against odom after a test drive.
    wheel_separation: 0.679
    wheel_radius: 0.053
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    cmd_vel_timeout: 0.25
    publish_rate: 50.0
    use_stamped_vel: false

    odom_frame_id: odom
    base_frame_id: base_footprint

    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    # Integrate wheel joint position (radians), not cmd_vel.
    open_loop: false
    enable_odom_tf: false

    linear:
      x:
        has_velocity_limits: true
        max_velocity: 0.5
        min_velocity: -0.5
        has_acceleration_limits: true
        max_acceleration: 1.0

    angular:
      z:
        has_velocity_limits: true
        max_velocity: 1.0
        min_velocity: -1.0
        has_acceleration_limits: true
        max_acceleration: 2.0


joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true


fork_position_controller:
  ros__parameters:
    joints: ["Slider_43"]