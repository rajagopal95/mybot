scan_filter_node:
  ros__parameters:
    use_sim_time: true

    filter1:
      name: footprint_filter
      type: laser_filters/LaserScanBoxFilter

      params:
        box_frame: base_link

        # Robot footprint (slightly larger than chassis)
        min_x: -0.23
        max_x:  0.23

        min_y: -0.18
        max_y:  0.18

        # Remove anything from ground to above the robot
        min_z: -0.10
        max_z:  0.35

        # Remove points INSIDE the box
        invert: false
