ekf_filter_node:
  ros__parameters:

    frequency: 50.0
    sensor_timeout: 0.1

    two_d_mode: true

    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Wheel odometry: fuse VELOCITIES only. The pose in /odom is just the
    # integral of those same velocities, so fusing both double-counts it.
    odom0: /odom

    odom0_config: [
      false, false, false,   # x, y, z
      false, false, false,   # roll, pitch, yaw
      true,  true,  false,   # vx, vy (always 0 for diff drive = no-sideslip constraint), vz
      false, false, true,    # roll rate, pitch rate, vyaw
      false, false, false    # ax, ay, az
    ]

    odom0_queue_size: 10

    # IMU: gyro z only. Gazebo's IMU orientation is absolute in the world frame
    # (and carries zero covariance), so fusing its yaw fights the wheel odom.
    imu0: /imu

    imu0_config: [
      false, false, false,
      false, false, false,   # no absolute roll/pitch/yaw
      false, false, false,
      false, false, true,    # vyaw only
      false, false, false
    ]

    imu0_queue_size: 10

    imu0_remove_gravitational_acceleration: true
