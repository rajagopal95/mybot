# Nav2 params for ROS 2 Humble, differential drive warehouse forklift robot
# Planner:     Smac Hybrid-A* "GridBased" only (NavFn / Theta* removed)
# Controllers: RPP as "FollowPath" (primary: stop → align to path → go),
#              MPPI and DWB kept as selectable alternates.
# Behavior tree: navigate_static_replan_w_recovery.xml
#   - Follow green path; at 1 Hz IsPathValid — if blocked, replan around it
#   - Global costmap = static map + lidar voxel (so new static obstacles count)
#   - Recovery: clear / wait / backup (no Spin)
#
# Tuned for narrow spaces (warehouse aisles 0.9m - 1.2m):
# - Polygonal footprint measured from the STL meshes (origin = axle midpoint):
#   about 1.07 m long (0.15 m ahead, 0.93 m behind), 0.62 m wide at the wheels,
#   narrow forks (+-0.15 m) at the rear. Same polygon in both costmaps.
# - footprint_padding 0.01 m in both costmaps (they must match).
# - 0.30 m inflation (was 0.5 — choked 0.9–1.2 m aisles and caused weave/stuck).
#   cost_scaling_factor 5.0 softens the remaining gradient in BOTH costmaps
#   and the MPPI ObstaclesCritic (must match).
# - Soft angular accel for smooth turning (velocity_smoother + DWB/MPPI).
# - Narrow-aisle cruise ~0.22 m/s, angular capped ~0.40 rad/s to reduce weave.
# - Ultrasonic guard on cmd_vel (not costmap); sensors max 4 cm
# - Odometry: /odometry/filtered (wheel vx/wz + IMU yaw-rate EKF)

amcl:
  ros__parameters:
    use_sim_time: true
    # Higher alphas = less trust in wheel odom (forklift slips / bad in-place
    # spins were dragging AMCL into the wrong warehouse aisle).
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 10.0
    laser_min_range: 0.15
    laser_model_type: "likelihood_field"
    max_beams: 120
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    # Gentle recovery only. recovery_alpha_fast=0.1 caused mid-run map
    # teleports (1.3,1.3)→(-1.9,-4.8). Slow recovery still helps after TF stalls.
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.001
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.1
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.10
    update_min_d: 0.10
    # Was z_hit=z_rand=0.5 — too random, locked onto wrong shelf corridor
    # with high confidence after odom slip.
    z_hit: 0.7
    z_max: 0.05
    z_rand: 0.2
    z_short: 0.05
    scan_topic: scan_filtered

amcl_map_client:
  ros__parameters:
    use_sim_time: true

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: true

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # Static-only replan BT (path rewritten by navigation.launch.py).
    default_nav_to_pose_bt_xml: "__MYBOT_BT_XML__"
    default_nav_through_poses_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

controller_server:
  ros__parameters:
    use_sim_time: true
    # 10 Hz matches Gazebo/sim load; MPPI at 20 Hz was missing cycles.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.05
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.05
    # The controller reads its current speed from this topic. The default is
    # "odom", which does not exist here, so the controller saw zero speed.
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    # RPP primary: when heading-to-path is off, stop + rotate in place, then drive.
    # MPPI/DWB selectable for comparison.
    controller_plugins: ["FollowPath", "MPPI", "DWB"]

    progress_checker:
      # PoseProgressChecker: XY *or* yaw counts. Required for RPP
      # use_rotate_to_heading — in-place align has v=0, so XY-only
      # SimpleProgressChecker aborted the 2nd goal after 120 s of spinning
      # ("Failed to make progress") even though it was centre-aligning.
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.05
      required_movement_angle: 0.20
      # Was 45 s — aborted on slow aisle turns / Dubins hooks.
      movement_time_allowance: 90.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # Was 0.45 — robot stopped ~half a metre short of the clicked goal.
      xy_goal_tolerance: 0.15
      # Do not hunt clicked arrow yaw (that forced Dubins end-circles).
      yaw_goal_tolerance: 0.60

    # ---------------- RPP (primary FollowPath) ----------------
    # AGV style: if angle to the path carrot exceeds rotate_to_heading_min_angle,
    # linear vel = 0 and the robot rotates in place until it faces the path,
    # then continues. Also rotates to goal yaw once XY is reached.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # Slower in aisles — live run saturated wz ±0.4 while weaving at 0.28 m/s.
      desired_linear_vel: 0.22
      # Slightly longer carrot damps left/right oscillation in narrow corridors.
      lookahead_dist: 0.50
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.80
      lookahead_time: 1.1
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 1.0
      min_approach_linear_velocity: 0.06
      approach_velocity_scaling_dist: 0.80
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.80
      regulated_linear_scaling_min_speed: 0.06
      # OFF until in-place spin works: stuck rotate made both wheels drive
      # forward → odom/AMCL drifted ~3 m into the wrong aisle.
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 0.40
      rotate_to_heading_angular_vel: 0.50
      max_angular_accel: 1.0
      max_robot_pose_search_dist: 2.0
      use_interpolation: true
      # Must stay false when use_rotate_to_heading is true.
      allow_reversing: false

    # ---------------- MPPI (alternate) ----------------
    MPPI:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "DiffDrive"
      # Lighter for Gazebo so the control loop keeps up.
      time_steps: 30
      model_dt: 0.1
      batch_size: 400
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      vx_max: 0.32
      vx_min: -0.12
      wz_max: 0.55
      vx_std: 0.15
      wz_std: 0.25
      prune_distance: 1.6
      transform_tolerance: 1.0
      visualize: false
      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic",
                "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
                "PathAngleCritic", "PreferForwardCritic"]
      ObstaclesCritic:
        enabled: true
        consider_footprint: true
        collision_cost: 10000.0
        collision_margin_distance: 0.03
        # Don't let obstacle soft-cost push the robot off the path near the goal.
        near_goal_distance: 0.8
        critical_weight: 20.0
        repulsion_weight: 0.02
        cost_scaling_factor: 5.0
        inflation_radius: 0.30
      PathAlignCritic:
        enabled: true
        cost_power: 1
        # Stronger hug of the green line; stay active closer to the goal.
        cost_weight: 22.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 2
        threshold_to_consider: 0.20
        offset_from_furthest: 8
        use_path_orientations: false
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        offset_from_furthest: 4
        threshold_to_consider: 0.25
        max_angle_to_furthest: 0.85
        mode: 1
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 16.0
        offset_from_furthest: 5
        threshold_to_consider: 1.2
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      GoalCritic:
        enabled: true
        cost_power: 1
        # Pull hard onto the goal so we don't stop 0.3–0.5 m short.
        cost_weight: 18.0
        threshold_to_consider: 1.6
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        threshold_to_consider: 0.50
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

    # ---------------- DWB (alternate) ----------------
    DWB:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.30
      max_vel_y: 0.0
      max_vel_theta: 0.40
      min_speed_xy: 0.0
      max_speed_xy: 0.30
      min_speed_theta: 0.0
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 0.6
      decel_lim_x: -0.6
      decel_lim_y: 0.0
      decel_lim_theta: -0.6
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 28
      sim_time: 1.6
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 1.0
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.08
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint",
                "GoalAlign", "PathAlign", "PathDist", "GoalDist", "PreferForward"]
      ObstacleFootprint.scale: 0.02
      PathAlign.scale: 28.0
      PathAlign.forward_point_distance: 0.30
      GoalAlign.scale: 18.0
      GoalAlign.forward_point_distance: 0.25
      PathDist.scale: 28.0
      GoalDist.scale: 20.0
      PreferForward.scale: 8.0
      RotateToGoal.scale: 20.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: true
      transform_tolerance: 1.0
      rolling_window: true
      # The robot is about 1.07 m long and 0.62 m wide.  Four metres leaves
      # enough observed map for a safe reverse/exit manoeuvre when an aisle
      # is blocked.
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[0.15, 0.07], [0.05, 0.07], [0.05, 0.32], [-0.05, 0.32], [-0.05, 0.28], [-0.46, 0.28], [-0.46, 0.15], [-0.93, 0.15], [-0.93, -0.15], [-0.46, -0.15], [-0.46, -0.28], [-0.05, -0.28], [-0.05, -0.32], [0.05, -0.32], [0.05, -0.07], [0.15, -0.07]]"
      footprint_padding: 0.01
      publish_footprint: true
      # Ultrasonics handled by ultrasonic_guard on cmd_vel (not costmap) so a
      # stale range layer can never freeze the controller.
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Soft/narrow: 0.5 m inflation left almost no free cells in 0.9–1.2 m aisles.
        cost_scaling_factor: 5.0
        inflation_radius: 0.30

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: true
      transform_tolerance: 1.0
      footprint: "[[0.15, 0.07], [0.05, 0.07], [0.05, 0.32], [-0.05, 0.32], [-0.05, 0.28], [-0.46, 0.28], [-0.46, 0.15], [-0.93, 0.15], [-0.93, -0.15], [-0.46, -0.15], [-0.46, -0.28], [-0.05, -0.28], [-0.05, -0.32], [0.05, -0.32], [0.05, -0.07], [0.15, -0.07]]"
      footprint_padding: 0.01
      publish_footprint: true
      resolution: 0.05
      track_unknown_space: true
      # Map + lidar so newly seen static obstacles invalidate the global path
      # and the replan BT can route around them.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.30
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]

    # Footprint-aware Hybrid-A*. Plugin name "GridBased" is kept so the
    # behavior tree still finds it.
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      # Must stay <= xy_goal_tolerance or the green path ends short of the goal.
      tolerance: 0.15
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      # Forward-only Dubins (forks stay out of unknown space on reverse).
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      minimum_turning_radius: 0.35
      analytic_expansion_ratio: 2.0
      # Tiny cap — larger values drew the circular hook to match goal yaw.
      analytic_expansion_max_length: 0.30
      reverse_penalty: 2.0
      change_penalty: 0.20
      # Prefer straight aisle lines over curling to the clicked arrow.
      non_straight_penalty: 2.5
      cost_penalty: 1.6
      lookup_table_size: 20.0
      cache_obstacle_heuristic: true
      # Smac's own smoother also rounded Dubins into circles.
      smooth_path: false

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      w_smooth: 0.3
      w_data: 0.2
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_timeout: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.55
    min_rotational_vel: 0.18
    rotational_acc_lim: 0.9

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    # Keep v/w ratio when one axis saturates → stay on green path in turns.
    scale_velocities: True
    # OPEN_LOOP: CLOSED_LOOP was trapping commands at ~0.03 m/s because odom
    # feedback stayed near zero while the robot was underserved by the ramp.
    feedback: "OPEN_LOOP"
    # Slightly higher cruise + yaw for responsive but soft corners.
    # Cap yaw to cut aisle weave (live run held wz at ±0.4 continuously).
    max_velocity: [0.28, 0.0, 0.40]
    min_velocity: [-0.12, 0.0, -0.40]
    max_accel: [0.35, 0.0, 0.80]
    max_decel: [-0.45, 0.0, -0.80]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0