# Nav2 params for ROS 2 Humble, differential drive warehouse forklift robot
# Controllers: MPPI (primary) and DWB (available fallback).
# Behavior tree: plan once; a dynamic obstacle stops the robot until the same
#                path becomes clear. It does not replan, spin, or back up.
# Planner:     Smac Hybrid-A* "GridBased" only (footprint-aware, can reverse)
#              NavFn and Theta* are intentionally not configured.
#
# Tuned for narrow spaces (warehouse aisles 0.9m - 1.2m):
# - Polygonal footprint measured from the STL meshes (origin = axle midpoint):
#   about 1.07 m long (0.15 m ahead, 0.93 m behind), 0.62 m wide at the wheels,
#   narrow forks (+-0.15 m) at the rear. Same polygon in both costmaps.
# - footprint_padding 0.01 m in both costmaps (they must match).
# - 0.15 m inflation, cost_scaling_factor 20.0 in BOTH costmaps and the MPPI.
#   This retains clearance but keeps a 1.0 m corridor traversable.
# - MPPI: low repulsion weight and a 0.02 m collision margin.  Obstacles and
#   the footprint are still lethal; this only removes excessive soft clearance.
# - Velocity limits smoothed for 270 kg AMR: max 0.35 m/s, max 0.60 rad/s,
#   reverse up to 0.20 m/s so it can back out of tight spots
# - Navigation pose: wheel odometry fused with IMU yaw rate by robot_localization.
# - Obstacle inputs: 2D LiDAR through /scan_filtered plus the six ultrasonic
#   Range topics for close-range coverage. A regular webcam is not an obstacle
#   source and no depth-camera / PointCloud2 plugin is needed.
# - Consistent odometry topic: /odometry/filtered (fused with TF)

amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 10.0
    laser_min_range: 0.15
    laser_model_type: "likelihood_field"
    max_beams: 120
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan_filtered

amcl_map_client:
  ros__parameters:
    use_sim_time: true

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: true

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    default_nav_to_pose_bt_xml: "/home/raja/mybot_ws/src/mybot/mybot_navigation/behavior_trees/navigate_straight_no_replan.xml"
    default_nav_through_poses_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.05
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.05
    # The controller reads its current speed from this topic. The default is
    # "odom", which does not exist here, so the controller saw zero speed.
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["MPPI", "DWB"]

    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.25
      required_movement_angle: 0.25
      movement_time_allowance: 15.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.25

    # ---------------- MPPI (primary controller) ----------------
    MPPI:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "DiffDrive"
      # Keep the optimizer inside the 20 Hz control budget on the simulation PC.
      # The previous 56 x 1000 rollout workload repeatedly missed its deadline
      # and ended in "Optimizer fail to compute path" in tight aisles.
      time_steps: 40
      model_dt: 0.05
      batch_size: 600
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      vx_max: 0.35
      vx_min: -0.20          # was -0.10; allows reversing out of tight spots
      wz_max: 0.60
      vx_std: 0.15
      wz_std: 0.30
      prune_distance: 1.5
      transform_tolerance: 0.1
      visualize: false
      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic",
                "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
                "PathAngleCritic", "PreferForwardCritic"]
      ObstaclesCritic:
        enabled: true
        consider_footprint: true
        collision_cost: 10000.0
        collision_margin_distance: 0.02
        near_goal_distance: 0.4
        critical_weight: 20.0
        repulsion_weight: 0.08
        cost_scaling_factor: 20.0  # must equal both inflation layers
        inflation_radius: 0.15     # must equal both inflation layers

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.785398
        mode: 1

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0
        threshold_to_consider: 0.5

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        threshold_to_consider: 0.5

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

    # ---------------- DWB (available fallback controller) ----------------
    DWB:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: -0.20
      min_vel_y: 0.0
      max_vel_x: 0.35
      max_vel_y: 0.0
      max_vel_theta: 0.60
      min_speed_xy: 0.0
      max_speed_xy: 0.35
      min_speed_theta: 0.0
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 1.5
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -1.5
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.20
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.04
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: true
      rolling_window: true
      # The robot is about 1.07 m long and 0.62 m wide.  Four metres leaves
      # enough observed map for a safe reverse/exit manoeuvre when an aisle
      # is blocked.
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[0.15, 0.07], [0.05, 0.07], [0.05, 0.32], [-0.05, 0.32], [-0.05, 0.28], [-0.46, 0.28], [-0.46, 0.15], [-0.93, 0.15], [-0.93, -0.15], [-0.46, -0.15], [-0.46, -0.28], [-0.05, -0.28], [-0.05, -0.32], [0.05, -0.32], [0.05, -0.07], [0.15, -0.07]]"
      footprint_padding: 0.01
      publish_footprint: true
      # A planar LiDAR produces LaserScan messages, so use the 2D obstacle
      # layer. VoxelLayer is for 3D observations (for example PointCloud2 from
      # a depth camera) and gives no benefit here.
      # Ultrasonics cover objects below the LiDAR plane. Keep them local: they
      # are a close-range safety input, not a replacement for the static map.
      plugins: ["obstacle_layer", "range_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 20.0
        inflation_radius: 0.15

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          sensor_frame: laser_link
          obstacle_min_range: 0.10
          obstacle_max_range: 2.5
          raytrace_min_range: 0.10
          raytrace_max_range: 3.0
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"

      range_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        topics: ["/ultrasonic_front_left", "/ultrasonic_front_right",
                 "/ultrasonic_rear_left", "/ultrasonic_rear_right",
                 "/ultrasonic_side_left", "/ultrasonic_side_right"]
        # 15 degrees matches the simulated ultrasonic ray cone.
        phi: 0.261799
        clear_on_max_reading: true
        clear_threshold: 0.2
        mark_threshold: 0.8
        no_readings_timeout: 0.5
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: true
      footprint: "[[0.15, 0.07], [0.05, 0.07], [0.05, 0.32], [-0.05, 0.32], [-0.05, 0.28], [-0.46, 0.28], [-0.46, 0.15], [-0.93, 0.15], [-0.93, -0.15], [-0.46, -0.15], [-0.46, -0.28], [-0.05, -0.28], [-0.05, -0.32], [0.05, -0.32], [0.05, -0.07], [0.15, -0.07]]"
      footprint_padding: 0.01
      publish_footprint: true
      resolution: 0.05
      track_unknown_space: true
      # The static map is used for global planning; live LiDAR scan data marks
      # and clears nearby dynamic obstacles. No camera/depth source is used.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          sensor_frame: laser_link
          obstacle_min_range: 0.10
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          obstacle_max_range: 2.5
          raytrace_max_range: 3.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 20.0
        inflation_radius: 0.15
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]

    # Footprint-aware Hybrid-A*. Plugin name "GridBased" is kept so the
    # behavior tree still finds it.
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.05
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      # Reeds-Shepp can include reverse segments. MPPI and DWB are both
      # configured with a negative minimum linear velocity to follow them.
      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 72
      minimum_turning_radius: 0.2              # starting guess, tune for the robot
      analytic_expansion_ratio: 3.5
      reverse_penalty: 2.0                     # reverse when needed, not casually (lidar can't see behind)
      change_penalty: 0.0
      non_straight_penalty: 2.0
      # Let Hybrid-A* use the centre of a traversable aisle.  Lethal cells and
      # the polygonal footprint remain hard constraints.
      cost_penalty: 1.3
      lookup_table_size: 20.0
      cache_obstacle_heuristic: true           # faster replans to the same goal
      smooth_path: true

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_timeout: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.35, 0.0, 0.60]
    min_velocity: [-0.20, 0.0, -0.60]   # matches MPPI vx_min
    max_accel: [1.0, 0.0, 1.5]
    max_decel: [-1.0, 0.0, -1.5]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
